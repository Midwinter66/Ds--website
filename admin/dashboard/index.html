<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>冬 · 控制台</title><link rel="stylesheet" href="/Ds--website/_astro/admin.A7jXhphv.css"></head><body class="admin-body"><div class="admin-layout"><!-- 侧边栏 --><aside class="admin-sidebar"><div class="admin-logo">冬</div><nav class="admin-nav"><a href="./" class="nav-item active" data-page="list"><span class="nav-icon">📝</span><span>文章管理</span></a><a href="#" id="newPostNav" class="nav-item"><span class="nav-icon">✏️</span><span>写文章</span></a><a href="../../" class="nav-item" target="_blank"><span class="nav-icon">🏠</span><span>查看网站</span></a></nav><div class="admin-user"><div class="user-info"><div class="user-avatar">冬</div><div class="user-detail"><span id="userEmail" class="user-email">加载中...</span></div></div><button id="logoutBtn" class="logout-btn">退出</button></div></aside><!-- 主内容区 --><main class="admin-main"><header class="admin-header"><h1 id="pageTitle">文章管理</h1><button id="newPostBtn" class="primary-btn">+ 新建文章</button></header><!-- 文章列表 --><div id="postList" class="post-list-container"><div class="list-toolbar"><div class="toolbar-left"><input type="text" id="searchInput" class="search-input" placeholder="搜索文章..."><select id="categoryFilter" class="filter-select"><option value="all">全部分类</option><option value="snow">思雪（想法）</option><option value="ice">冰研（技术）</option><option value="frost">积素（知识）</option><option value="soil">冻土（项目）</option><option value="night">夜翻（读书）</option></select><select id="statusFilter" class="filter-select"><option value="all">全部状态</option><option value="idea">想法</option><option value="ongoing">进行中</option><option value="done">已完成</option><option value="archived">归档</option></select></div><div class="toolbar-right"><span id="postCount" class="post-count">0 篇文章</span></div></div><div id="postsTable" class="posts-table"><div class="loading">加载中...</div></div></div><!-- 编辑表单 --><div id="postEditor" class=
